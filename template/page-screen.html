<!doctype html><html><head><meta charset="utf-8"><title>screen composition</title>
<!-- Layout for footage that is mainly a screen recording (the speaker in a small webcam bubble or not at all).
     Card on top, motion dock below it, subtitles at the bottom. Copy next to scenes.js; set SKILL_TEMPLATE. -->
<style>
/* Neutral defaults; theme.css (your style file) overrides them. Same variables as page.html. */
:root{--paper:#F4F4F2;--ink:#141414;--accent:#141414;--accent-ink:#FFFFFF;--hot:#141414;--mark:#DCDCD6;--muted:#6E6E6A;--line:rgba(20,20,20,.06);
--font:"Source Han Sans","PingFang SC",sans-serif;--font-display:"Source Han Sans","PingFang SC",sans-serif;--display-weight:900;
--bw:4px;--radius:24px;--shadow:0 18px 40px rgba(0,0,0,.14);--sub-color:#FFFFFF;--sub-stroke:#000000}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:var(--font);color:var(--ink)}
#bg{position:absolute;inset:0;background:var(--paper);background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:60px 60px}
.big{font-family:var(--font-display);font-weight:var(--display-weight);line-height:1.05}
.abs{position:absolute}
/* header */
#head{position:absolute;left:60px;right:60px;top:62px;height:70px;display:flex;align-items:center;gap:18px;z-index:6}
#chapter{background:var(--ink);color:var(--paper);font-weight:900;font-size:38px;padding:8px 26px;border-radius:999px;white-space:nowrap}
#chapter i{font-style:normal;color:var(--mark);margin-right:12px;font-family:var(--font-display)}
#brand{margin-left:auto;font-size:32px;font-weight:800;color:var(--ink);opacity:.75}
/* screen card */
#screen{position:absolute;left:60px;top:156px;width:960px;height:1140px;border:var(--bw) solid var(--ink);border-radius:var(--radius);overflow:hidden;background:#222;box-shadow:var(--shadow);z-index:3;transform-origin:50% 50%}
#simg{position:absolute;left:0;top:0;width:948px;height:1186px;max-width:none;transform-origin:0 0}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
/* lower dock */
#dock{position:absolute;left:0;right:0;top:1318px;height:236px;z-index:5}
.scene{position:absolute;inset:0;visibility:hidden}
.full{position:absolute;inset:0;z-index:7;visibility:hidden;background:var(--paper)}
.chip{position:absolute;background:#fff;color:var(--ink);font-weight:900;font-size:54px;padding:12px 32px;border-radius:calc(var(--radius) * .75);border:var(--bw) solid var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.chip.r{background:var(--accent);color:var(--accent-ink)}
.chip.k{background:var(--ink);color:var(--paper)}
.card{position:absolute;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.slam{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.tag{position:absolute;font-size:30px;font-weight:900;background:var(--accent);color:var(--accent-ink);padding:4px 16px;border-radius:10px}
.lab{font-size:34px;font-weight:900}
.flow{position:absolute;left:46px;right:46px;top:24px;display:flex;align-items:center;justify-content:center;gap:10px}
.flow .st{background:#fff;border:var(--bw) solid var(--ink);border-radius:calc(var(--radius) * .8);box-shadow:var(--shadow);font-size:40px;font-weight:900;padding:14px 18px;white-space:nowrap}
.flow .st b{font-family:var(--font-display);color:var(--hot);margin-right:6px}
.flow .ar{font-size:44px;font-weight:900}
.ticks{position:absolute;left:80px;right:80px;top:6px}
.ticks div{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:900;height:66px}
.ticks u{text-decoration:none;background:#1f9d55;color:#fff;font-size:28px;padding:4px 12px;border-radius:8px}
.zig{position:absolute;left:90px;right:90px;top:30px;height:150px}
#sub{position:absolute;left:30px;right:30px;top:1584px;text-align:center;z-index:9;font-weight:900;font-size:62px;line-height:1.2;color:var(--sub-color);text-shadow:0 0 3px var(--sub-stroke),0 3px 0 var(--sub-stroke),3px 0 0 var(--sub-stroke),-3px 0 0 var(--sub-stroke),0 -3px 0 var(--sub-stroke),3px 3px 0 var(--sub-stroke),-3px 3px 0 var(--sub-stroke),3px -3px 0 var(--sub-stroke),-3px -3px 0 var(--sub-stroke),0 8px 18px rgba(0,0,0,.4)}
#sub.long{font-size:54px}
#sub b{color:var(--accent-ink);background:var(--accent);padding:0 12px;border-radius:10px;text-shadow:none;font-weight:900;margin:0 3px}
#wipe{position:absolute;inset:0;z-index:10;background:var(--ink);visibility:hidden}
#flash{position:absolute;inset:0;z-index:10;background:var(--paper);visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
#fnum{font-size:560px;line-height:.95;color:var(--hot)}
#fname{font-size:120px;font-weight:900;color:var(--ink);margin-top:10px}
.sticker{position:absolute;z-index:3}
</style>
<link rel="stylesheet" href="theme.css"></head><body>
<div id="world"><div id="bg"></div>
<div id="head"><div id="chapter"></div><div id="brand"><!-- 署名，从风格文件或创作者设定里取 --></div></div>
<div id="screen"><img id="simg"><div id="vig"></div></div>
<div id="dock"></div></div>
<div id="fulls"></div>
<div id="wipe"></div><div id="flash"><div id="fnum" class="big"></div><div id="fname"></div></div><div id="sub"></div>
<script src="data.js"></script><script src="scenes.js"></script><script src="SKILL_TEMPLATE/engine-screen.js"></script></body></html>
